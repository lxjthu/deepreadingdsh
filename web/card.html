<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片预览与编辑</title><link rel="stylesheet" href="./card.css"></head>
<body><header><h1 id="card-title">卡片预览与编辑</h1><div><button id="save" type="button" disabled>保存修改</button><button id="reload" type="button">重新加载</button><button id="export" type="button" disabled>导出 Markdown</button></div></header>
<p id="status" role="status">正在读取卡片…</p>
<main><section class="edit" aria-label="编辑卡片"><h2>编辑</h2>
<label>标题<input id="title" maxlength="200"></label><label>摘要<textarea id="summary" rows="3" maxlength="2000"></textarea></label>
<label>标签（分号分隔）<input id="tags"></label><label>正文（Markdown）<textarea id="body" rows="24" maxlength="30000"></textarea></label>
</section><section class="preview" aria-label="预览卡片"><h2>预览</h2><h3 id="preview-title"></h3><p id="preview-summary"></p><p id="preview-tags"></p><article id="preview-body"></article></section>
<section class="source" aria-label="来源文献属性"><h2>来源文献属性</h2><p id="citation"></p><p id="metadata-origin"></p><dl id="properties"></dl><h3>原文选段</h3><blockquote id="quote"></blockquote><div id="card-images"></div><div id="card-recognition"></div><div id="excerpt-contexts"></div><details><summary>前后文</summary><h3>上文</h3><p id="before"></p><h3>下文</h3><p id="after"></p></details></section></main>
<script src="./katex/katex.min.js"></script><script src="./card.js"></script></body></html>
